<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | José Londoño</title>
  <link rel="stylesheet" href="form.css">
</head>
<body class="vista-contacto-simple">

  <div class="contenedor-regresar">
    <a href="index.html" class="boton-regresar">
      ← Volver al inicio
    </a>
  </div>

  <main class="bloque-central-contacto">
    <div class="tarjeta-formulario-simple">
      
      <div class="encabezado-formulario">
        <h2>Contacto</h2>
        <p>Escríbeme tu consulta y te responderé lo antes posible</p>
      </div>

      <form action="#" method="POST" class="form-centrado">
        
        <div class="grupo-campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
        </div>

        <div class="grupo-campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
        </div>

        <div class="grupo-campo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" placeholder="¿En qué puedo ayudarte?" rows="5" required></textarea>
        </div>

        <button type="submit" class="boton-enviar-simple">Enviar mensaje</button>

      </form>
    </div>
  </main>

</body>
</html>
